name: Governance Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, governance]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Environment
        shell: cmd
        run: |
          echo GitHub Runner Connected!
          echo Runner Name: %RUNNER_NAME%
          echo Computer: %COMPUTERNAME%

          git --version
          dotnet --version
          node --version
          npm --version