
name: Reusable Technology Governance Scan

on:
  workflow_call:
    inputs:
      project_path:
        description: 'Relative path to the project'
        required: false
        type: string
        default: '.'

      project_type:
        description: 'Project framework type'
        required: false
        type: string
        default: 'auto'

    outputs:
      scan_status:
        description: 'Result of governance workflow'
        value: ${{ jobs.governance.outputs.scan_status }}

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  governance:
    runs-on: [self-hosted, Windows, governance]

    outputs:
      scan_status: ${{ steps.status.outputs.scan_status }}

    steps:
      - name: Checkout Developer Repository
        uses: actions/checkout@v4
        with:
          path: developer-project
          persist-credentials: false

      - name: Checkout Governance Engine
        uses: actions/checkout@v4
        with:
          repository: nvr-4km4l/technology-governance
          path: governance
          persist-credentials: false

      - name: Verify Environment
        shell: pwsh
        run: |
          Write-Host "Technology Governance Scanner"
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Project path: ${{ inputs.project_path }}"
          Write-Host "Project type: ${{ inputs.project_type }}"

          & "C:\Program Files\PowerShell\7\pwsh.exe" --version

      - name: Verify Developer Project
        shell: pwsh
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          $projectRoot = Join-Path $env:GITHUB_WORKSPACE "developer-project"
          $projectPath = Join-Path $projectRoot $env:PROJECT_PATH

          if (-not (Test-Path $projectPath -PathType Container)) {
              throw "Developer project directory not found: $projectPath"
          }

          Write-Host "Developer project found: $projectPath"


      - name: Scan Developer Frameworks
        shell: pwsh
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          PROJECT_TYPE: ${{ inputs.project_type }}
        run: |
          $ErrorActionPreference = 'Stop'

          $projectRoot = Join-Path $env:GITHUB_WORKSPACE "developer-project"
          $projectPath = Join-Path $projectRoot $env:PROJECT_PATH
          $reportPath = Join-Path $env:GITHUB_WORKSPACE "governance\reports\technology-health-report.json"

          & "C:\Program Files\PowerShell\7\pwsh.exe" `
            -NoProfile `
            -NonInteractive `
            -File "governance\scripts\generate-developer-report.ps1" `
            -ProjectPath $projectPath `
            -ProjectType $env:PROJECT_TYPE `
            -OutputPath $reportPath

          if ($LASTEXITCODE -ne 0) {
              throw "Developer framework scan failed."
          }

          if (-not (Test-Path -LiteralPath $reportPath)) {
              throw "Technology health report was not generated."
          }

          Write-Host "Developer framework scan completed successfully."

      - name: Upload Developer Technology Report
        uses: actions/upload-artifact@v4
        with:
          name: technology-health-report
          path: governance/reports/technology-health-report.json
          if-no-files-found: error

      - name: Retrieve Previous Developer Baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          & "C:\Program Files\PowerShell\7\pwsh.exe" `
            -NoProfile `
            -NonInteractive `
            -File "governance\scripts\get-previous-developer-report.ps1" `
            -Repository $env:REPOSITORY `
            -CurrentRunId $env:RUN_ID `
            -Branch $env:BRANCH `
            -CurrentReport "governance\reports\technology-health-report.json" `
            -OutputPath "governance\reports\previous-framework-report.json"

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to retrieve developer baseline."
          }

      - name: Compare Developer Framework Versions
        shell: pwsh
        run: |
          & "C:\Program Files\PowerShell\7\pwsh.exe" `
            -NoProfile `
            -NonInteractive `
            -File "governance\scripts\compare-frameworks.ps1" `
            -PreviousReport "governance\reports\previous-framework-report.json" `
            -CurrentReport "governance\reports\technology-health-report.json" `
            -OutputPath "governance\reports\framework-change-report.json"

          if ($LASTEXITCODE -ne 0) {
              throw "Framework comparison failed."
          }

      - name: Upload Developer Framework Change Report
        uses: actions/upload-artifact@v4
        with:
          name: framework-change-report
          path: governance/reports/framework-change-report.json
          if-no-files-found: error

      - name: Create Developer Framework Change Issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          & "C:\Program Files\PowerShell\7\pwsh.exe" `
            -NoProfile `
            -NonInteractive `
            -File "governance\scripts\create-framework-change-issue.ps1" `
            -ReportPath "governance\reports\framework-change-report.json" `
            -Repository $env:TARGET_REPOSITORY `
            -CreateIssue

          if ($LASTEXITCODE -ne 0) {
              throw "Framework change issue creation failed."
          }

      # Developer vulnerability scanning
      - name: Scan Developer Vulnerabilities
        shell: pwsh
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          PROJECT_TYPE: ${{ inputs.project_type }}
        run: |
          $ErrorActionPreference = 'Stop'

          $projectRoot = Join-Path $env:GITHUB_WORKSPACE "developer-project"
          $projectPath = Join-Path $projectRoot $env:PROJECT_PATH
          $reportPath = Join-Path $env:GITHUB_WORKSPACE "governance\reports\vulnerability-report.json"

          & "C:\Program Files\PowerShell\7\pwsh.exe" `
            -NoProfile `
            -NonInteractive `
            -File "governance\scripts\scan-developer-vulnerabilities.ps1" `
            -ProjectPath $projectPath `
            -ProjectType $env:PROJECT_TYPE `
            -OutputPath $reportPath

          if ($LASTEXITCODE -ne 0) {
              throw "Developer vulnerability scan failed."
          }

          if (-not (Test-Path -LiteralPath $reportPath)) {
              throw "Vulnerability report was not generated."
          }

          Write-Host "Developer vulnerability scan completed."

      # Upload vulnerability report
      - name: Upload Developer Vulnerability Report
        uses: actions/upload-artifact@v4
        with:
          name: developer-vulnerability-report
          path: governance/reports/vulnerability-report.json
          if-no-files-found: error

      # Create vulnerability issues in developer repository
      - name: Create Developer Vulnerability Issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          & "C:\Program Files\PowerShell\7\pwsh.exe" `
            -NoProfile `
            -NonInteractive `
            -File "governance\scripts\create-vulnerability-issue.ps1" `
            -ReportPath "governance\reports\vulnerability-report.json" `
            -Repository $env:TARGET_REPOSITORY `
            -CreateIssue

          if ($LASTEXITCODE -ne 0) {
              throw "Developer vulnerability issue creation failed."
          }

      - name: Set Scan Status
        id: status
        shell: pwsh
        run: |
          "scan_status=setup-verified" >> $env:GITHUB_OUTPUT
          Write-Host "Reusable workflow setup verified."
