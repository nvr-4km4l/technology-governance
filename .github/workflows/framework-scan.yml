name: Technology Framework Scan

on:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: 'Frontend branch to scan'
        required: true
        default: 'main'
        type: string
        options:
          - main
          - poc-version-test
          - poc-missing-manifest-test

      backend_ref:
        description: 'Backend branch to scan'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - poc-eol-test

  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  framework-scan:
    runs-on: [self-hosted, Windows, governance]

    steps:
      - name: Checkout Governance Repository
        uses: actions/checkout@v4
        with:
          path: governance
          persist-credentials: false

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: nvr-4km4l/poc-backend
          ref: ${{ inputs.backend_ref || 'main' }}
          path: poc-backend
          persist-credentials: false

      - name: Checkout Frontend Repository
        uses: actions/checkout@v4
        with:
          repository: nvr-4km4l/poc-frontend
          ref: ${{ inputs.frontend_ref || 'main' }}
          path: poc-frontend
          persist-credentials: false

      - name: Verify PowerShell 7
        shell: cmd
        run: |
          "C:\Program Files\PowerShell\7\pwsh.exe" --version

      - name: Scan Frameworks
        shell: cmd
        run: |
          "C:\Program Files\PowerShell\7\pwsh.exe" -NoProfile -NonInteractive -File "governance\scripts\generate-report.ps1" -BackendPath "%GITHUB_WORKSPACE%\poc-backend" -FrontendPath "%GITHUB_WORKSPACE%\poc-frontend"

      - name: Upload Technology Report
        uses: actions/upload-artifact@v4
        with:
          name: technology-health-report
          path: governance/reports/technology-health-report.json
          if-no-files-found: error
      
      - name: Scan Dependency Vulnerabilities
        shell: pwsh
        run: |
          & "governance\scripts\scan-vulnerabilities.ps1" `
            -BackendPath "${{ github.workspace }}\poc-backend" `
            -FrontendPath "${{ github.workspace }}\poc-frontend" `
            -OutputPath "${{ github.workspace }}\governance\reports\vulnerability-report.json"

      - name: Upload Vulnerability Report
        uses: actions/upload-artifact@v4
        with:
          name: technology-vulnerability-report
          path: governance/reports/vulnerability-report.json
          if-no-files-found: error

      - name: Create Vulnerability GitHub Issue
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "C:\Program Files\PowerShell\7\pwsh.exe" -NoProfile -NonInteractive -File "governance\scripts\create-vulnerability-issue.ps1" -ReportPath "governance\reports\vulnerability-report.json" -Repository "${{ github.repository }}" -CreateIssue
   
      - name: Create EOL GitHub Issue
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_ref == 'poc-eol-test' }}
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "C:\Program Files\PowerShell\7\pwsh.exe" -NoProfile -NonInteractive -File "governance\scripts\create-eol-issue.ps1" -ReportPath "governance\reports\technology-health-report.json" -CreateIssue
